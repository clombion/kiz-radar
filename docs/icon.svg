<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
<!-- Kiz Radar: two dancers in an embrace, their bodies closing into a radar ring with a sweep inside.
     design/render.cjs makes two files from it: docs/icon.svg, the favicon, with light colours on dark tabs, and
     docs/loading.svg, where the sweep turns and the dancers lean in (the parts named sweep, lead and follow) -->
<style>.a{fill:#7a2850;stroke:#7a2850}.b{fill:#c75a86;stroke:#c75a86}@media (prefers-color-scheme:dark){.a{fill:#fffbf5;stroke:#fffbf5}.b{fill:#f6a9c6;stroke:#f6a9c6}}</style>
<path class="a" d="M26.56 56.28 A21 21 0 0 1 26.56 15.72" stroke-width="6.5" stroke-linecap="round" style="fill:none"/>
<path class="b" d="M37.44 15.72 A21 21 0 0 1 37.44 56.28" stroke-width="6.5" stroke-linecap="round" style="fill:none"/>
<path class="b sweep" d="M32 36 L32 19 A17 17 0 0 1 46.7 27.5 Z" opacity=".3" style="stroke:none"/>
<circle class="a" cx="32" cy="36" r="3.4" style="stroke:none"/>
<circle class="a lead" cx="27" cy="7.5" r="5.4" style="stroke:none"/>
<circle class="b follow" cx="37" cy="7.5" r="5.4" style="stroke:none"/>
</svg>
