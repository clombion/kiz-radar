# The git hooks prek installs (mise run hooks): before a commit, the quick checks; before a push, every check, as
# Tests runs them. Each runs on the whole repository, as mise does, not on the files the commit changes.
default_install_hook_types = ["pre-commit", "pre-push"]

[[repos]]
repo = "local"

[[repos.hooks]]
id = "check-fast"
name = "mise run check:fast"
entry = "mise run check:fast"
language = "system"
stages = ["pre-commit"]
pass_filenames = false
always_run = true

[[repos.hooks]]
id = "check"
name = "mise run check"
# prek sets aside what is not staged; what is staged and not committed would be checked in place of the commit pushed
entry = "sh -c 'git diff --cached --quiet || { echo \"staged changes are not in the commit being pushed\" >&2; exit 1; }; mise run check'"
language = "system"
stages = ["pre-push"]
pass_filenames = false
always_run = true
