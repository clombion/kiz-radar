<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;650&family=Caveat:wght@700&display=block">
<script src="https://cdn.jsdelivr.net/npm/topojson-client@3.1.0/dist/topojson-client.min.js"></script>
<style>html,body{margin:0}body{width:1200px;height:630px;position:relative;overflow:hidden;font-family:Inter,sans-serif;background:#e9e4da;color:#2a1f22}
.dance{font:700 1.32em/1 Caveat,cursive;letter-spacing:0;color:#7a2850}
svg{position:absolute;inset:0}
.panel{position:absolute;left:0;top:0;bottom:0;width:680px;background:linear-gradient(90deg,#f6efe4 80%,#f6efe400)}
.brand{position:absolute;left:80px;top:70px;display:flex;align-items:center;gap:16px;font-size:34px;font-weight:650;letter-spacing:-.015em}
.brand img{width:52px;height:52px}
h1{position:absolute;left:80px;top:188px;width:520px;margin:0;font-size:60px;line-height:1.12;font-weight:500;letter-spacing:-.025em}
.sub{position:absolute;left:80px;top:404px;width:470px;margin:0;font-size:27px;line-height:1.35;color:#6d5f55}
/* a community's card: its title and subtitle in a column under an eyebrow, the name over a highlighter swipe; and, in
   place of the map, an example month as the site draws one, its trips' swipes the trails of a plane and a car */
.community{position:absolute;left:80px;top:168px;width:540px;display:flex;flex-direction:column;gap:18px}
.community h1,.community .sub{position:static;width:auto}
.eyebrow{display:flex;align-items:center;gap:10px;font-size:21px;font-weight:650;text-transform:uppercase;letter-spacing:.06em;color:#7a2850}
.eyebrow svg{position:static;width:28px;height:28px}
.swiped{background:linear-gradient(transparent 58%,rgb(214 96 145/.24) 58%,rgb(214 96 145/.24) 90%,transparent 90%);-webkit-box-decoration-break:clone;box-decoration-break:clone;padding:0 4px;margin:0 -4px}
.month{position:absolute;left:650px;top:96px;padding:26px 30px 30px 34px;background:#fdf9f2;border:1px solid #e3d8c8;border-radius:24px;box-shadow:0 18px 50px rgb(42 31 34/.08);display:grid;grid-template-columns:repeat(7,54px) 56px;grid-template-rows:38px repeat(4,88px)}
.month .wd{display:grid;place-items:center;font-size:17px;font-weight:500;color:#6d5f55}
.month .d{position:relative;z-index:1;display:grid;place-items:center;font-size:25px;font-weight:500;color:#2a1f22}
.month .past{color:#b3a796}
.month .fest{color:#7a2850;font-weight:650}
.month .dot::after{content:"";position:absolute;bottom:13px;left:50%;width:7px;height:7px;margin-left:-3.5px;border-radius:50%;background:#7a2850}
.month .ring{position:absolute;inset:22px 1px;color:#7a2850}
.month .ring svg{position:static;display:block;width:100%;height:100%}
.trail{position:relative;align-self:center;height:36px;margin:0 -6px 0 6px;border-radius:18px;background:rgb(214 96 145/.24);mask-image:linear-gradient(to right,transparent,#000 45%)}
.trail::after{content:"";position:absolute;inset:22% 2% 30% 30%;border-radius:inherit;background:rgb(214 96 145/.24);opacity:.5}
.vehicle{position:relative;z-index:2;align-self:center;justify-self:start;width:46px;height:46px;margin-left:4px;color:#7a2850}
.vehicle svg{position:static;display:block;width:100%;height:100%}
</style></head><body>
<svg viewBox="0 0 1200 630" id="m"></svg>
<div class="panel"></div>
<div class="brand"><img src="../public/mark.svg" alt="">Kiz Radar</div>
<h1>Find your next <span class="dance">Kizomba</span> festival</h1>
<p class="sub">Choose by artist, DJ or flight price from <span id="home"></span></p>
<script>
// [lat, lon, festivals] per city, and the home city where flights leave from, its airport's place: set by
// design/render.cjs; or a community's name alone, for its card (public/c/<key>/share.png), with an example month in
// place of the map, so that nothing but its name changes it
const { places: PLACES, home: [HOME, HOME_LAT, HOME_LON], community: COMMUNITY } = window.DRAWN;
document.getElementById('home').textContent = HOME;
if (COMMUNITY) {
  // an eyebrow (Lucide's users, as site/icons.ts draws it, and "Community"), the name over a swipe, and a subtitle the
  // same for every community; nothing of its members or trips, so that only its name changes it
  const h1 = document.querySelector('h1'), sub = document.querySelector('.sub'), column = document.createElement('div');
  column.className = 'community';
  column.innerHTML = `<div class="eyebrow"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
    stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/>
    <circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
    Community</div>`;
  const name = document.createElement('span');
  name.className = 'swiped';
  name.textContent = COMMUNITY;
  h1.replaceChildren(name);
  sub.textContent = 'Who’s going where, and when they fly in';
  column.append(h1, sub);
  document.body.append(column);
  // a long name made smaller until it fits above the bottom
  for (let size = 60; h1.offsetHeight > 270 && size > 30; size -= 4) h1.style.fontSize = `${size - 4}px`;
  document.querySelector('#m').remove();
  document.body.style.background = '#efe8dc';
  // an example month, as the site draws one: four weeks, the days before today grey, today ringed by hand, a long
  // weekend's festival days in the accent, a dot under a day only travelled on; and two trips' swipes, the trails of
  // a plane flying in over the festival (Lucide's plane, as site/icons.ts draws it, turned to fly right) and of a car
  const line = (d, turn = 0) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
    stroke-linecap="round" stroke-linejoin="round" style="rotate:${turn}deg">${d}</svg>`;
  const PLANE = line('<path d="M17.8 19.2 16 11l3.5-3.5C21 6 21.5 4 21 3c-1-.5-3 0-4.5 1.5L13 8 4.8 6.2c-.5-.1-.9.1-1.1.5l-.3.5c-.2.5-.1 1 .3 1.3L9 12l-2 3H4l-1 1 3 2 2 3 1-1v-3l3-2 3.5 5.3c.3.4.8.5 1.3.3l.5-.2c.4-.3.6-.7.5-1.2z"/>', 45);
  const CAR = line('<path d="M19 17h2c.6 0 1-.4 1-1v-3c0-.9-.7-1.7-1.5-1.9C18.7 10.6 16 10 16 10s-1.3-1.4-2.2-2.3c-.5-.4-1.1-.7-1.8-.7H5c-.6 0-1.1.4-1.4.9l-1.4 2.9A3.7 3.7 0 0 0 2 12v4c0 .6.4 1 1 1h2"/><circle cx="7" cy="17" r="2"/><path d="M9 17h6"/><circle cx="17" cy="17" r="2"/>');
  const RING = '<svg viewBox="0 0 40 32" preserveAspectRatio="none" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M27 4.5C19 2.2 7.5 4 4.2 12.5 1.6 19.6 8.3 28.2 19.8 28.4 31 28.6 37.6 22.4 36.3 14.3 35.2 7.6 27.9 3.6 18.4 4.6"/></svg>';
  const TODAY = 11, FESTIVAL = [20, 21, 22], TRAVELLED = [19];
  const month = document.createElement('div');
  month.className = 'month';
  month.innerHTML = [...'MTWTFSS'].map((w) => `<span class="wd">${w}</span>`).join('') +
    Array.from({ length: 28 }, (_, i) => {
      const day = i + 2, kind = day < TODAY ? 'past' : FESTIVAL.includes(day) ? 'fest' : TRAVELLED.includes(day) ? 'dot' : '';
      const at = `grid-area:${2 + Math.floor(i / 7)}/${1 + (i % 7)}`;
      return `<span class="d ${kind}" style="${at}">${day}${day === TODAY ? `<span class="ring">${RING}</span>` : ''}</span>`;
    }).join('') +
    // the plane's trail, Thursday to Sunday of the third week, and the car's, Friday to Sunday of the fourth
    '<span class="trail" style="grid-area:4/4/5/8"></span><span class="vehicle" style="grid-area:4/8">' + PLANE + '</span>' +
    '<span class="trail" style="grid-area:5/5/6/8"></span><span class="vehicle" style="grid-area:5/8">' + CAR + '</span>';
  document.body.append(month);
  window.ready = Promise.resolve();
}
// Mercator, fitted so Europe sits right of the text
const lon0 = -47, lon1 = 35, lat1 = 63.2, W = 1200;
const Y = la => Math.log(Math.tan(Math.PI / 4 + la * Math.PI / 360));
const k = W / ((lon1 - lon0) * Math.PI / 180);
const px = (lo, la) => [(lo - lon0) * Math.PI / 180 * k, (Y(lat1) - Y(la)) * k];
const svg = document.getElementById('m'), NS = 'http://www.w3.org/2000/svg';
const el = (t, a) => { const e = document.createElementNS(NS, t); for (const k in a) e.setAttribute(k, a[k]); svg.append(e); return e; };
if (!COMMUNITY) window.ready = fetch('https://cdn.jsdelivr.net/npm/world-atlas@2.0.2/countries-50m.json').then(r => r.json()).then(topo => {
  const land = topojson.feature(topo, topo.objects.countries);
  let d = '';
  for (const f of land.features) {
    const polys = f.geometry.type === 'Polygon' ? [f.geometry.coordinates] : f.geometry.coordinates;
    for (const poly of polys) for (const ring of poly) {
      if (ring.every(([lo]) => lo < lon0 - 20 || lo > lon1 + 40)) continue;
      d += 'M' + ring.map(([lo, la]) => px(lo, la).map(v => v.toFixed(1)).join(',')).join('L') + 'Z';
    }
  }
  el('path', { d, fill: '#fdf9f2', stroke: '#d5c7b2', 'stroke-width': 1 });
  const [bx, by] = px(HOME_LON, HOME_LAT);
  for (const [la, lo, n] of PLACES) { const [x, y] = px(lo, la); el('line', { x1: bx, y1: by, x2: x, y2: y, stroke: '#7a2850', 'stroke-opacity': .07, 'stroke-width': 1 }); }
  for (const [la, lo, n] of [...PLACES].sort((a, b) => b[2] - a[2])) { const [x, y] = px(lo, la);
    el('circle', { cx: x, cy: y, r: Math.min(4 + 2.6 * n, 18), fill: '#7a2850', 'fill-opacity': .6, stroke: '#fffbf5', 'stroke-width': 1.5 }); }
  el('circle', { cx: bx, cy: by, r: 8, fill: '#2a1f22', stroke: '#fffbf5', 'stroke-width': 3 });
  const t = el('text', { x: bx + 14, y: by - 10, 'font-size': 22, 'font-weight': 600, fill: '#2a1f22' }); t.textContent = HOME;
});
</script></body></html>
