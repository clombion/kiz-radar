name: The pipeline's steps
description: uv as mise.toml pins it (the steps need no node), and SRC, the export the steps work on (pipeline/db.py)
runs:
  using: composite
  steps:
    - uses: jdx/mise-action@v2
      with:
        install_args: uv
    - name: The export the steps work on
      shell: bash
      run: echo "SRC=$(uv run -q -m pipeline.db)" >> "$GITHUB_ENV"
