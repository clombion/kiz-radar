name: The pipeline's steps
description: >-
  uv as mise.toml pins it (the steps need no node), and the admin's claims (claims/, a submodule: pipeline/claims.py)
runs:
  using: composite
  steps:
    - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8  # v5.1.2
      with:
        install_args: uv
    - name: The admin's claims
      shell: bash
      run: git submodule update --init
