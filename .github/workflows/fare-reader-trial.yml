name: Fare reader trial

# Started by hand, once: three readers of Google Flights on the same eleven return searches from Bergen (the control,
# which a browser showed priced, and ten weekends whose latest search found no flight), each reader in its own
# environment, at least 20 s between requests to Google and stopping at its first HTTP 429 (scripts/
# fare_reader_trial.py). ours reads the search page as pipeline/fli_page.py does, with the pinned fli; explore asks
# fli main's GetExploreDestinations, the fli commit given installed in its step alone, never in uv.lock; chromium loads
# the same search page in a headless Chromium. The outcomes are the run's summary and its artifact; nothing is
# committed.
on:
  workflow_dispatch:
    inputs:
      readers:
        description: The readers to run (of ours, explore, chromium; they run in that order)
        default: ours explore chromium
      fli:
        description: The fli commit the explore reader installs (punitarani/fli, full SHA)
        default: 249a292e829672f5ee5d3477c2269a16acac9a20

permissions:
  contents: read

env:
  UV_LOCKED: 1   # uv.lock as committed, or the step fails
  PYTHONUNBUFFERED: 1   # each line a step prints is in the log as it goes, not all at its end
  READERS: ${{ inputs.readers }}
  FLI: ${{ inputs.fli }}
  TRIAL: scripts/fare_reader_trial.py

jobs:
  trial:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/steps
      - name: The inputs, and the parsers on the recorded pages
        run: |
          [[ "$FLI" =~ ^[0-9a-f]{40}$ ]] || { echo "fli: a full commit SHA, not '$FLI'"; exit 1; }
          for r in $READERS; do [[ "$r" =~ ^(ours|explore|chromium)$ ]] || { echo "no reader '$r'"; exit 1; }; done
          echo "OUT=$RUNNER_TEMP/reader-trial" >> "$GITHUB_ENV"
          uv run -q --group fares python "$TRIAL" selftest
          uv run -q --group fares python "$TRIAL" plan
      - name: ours
        if: ${{ !cancelled() && contains(inputs.readers, 'ours') }}
        run: uv run -q --group fares python "$TRIAL" ours --out "$OUT"
      - name: explore
        if: ${{ !cancelled() && contains(inputs.readers, 'explore') }}
        run: uv run -q --no-project --python 3.13 --with "git+https://github.com/punitarani/fli@$FLI" python "$TRIAL" explore --out "$OUT"
      - name: chromium
        if: ${{ !cancelled() && contains(inputs.readers, 'chromium') }}
        # the runner's own Chrome: Patchright's bundled Playwright installs no browser on the runner's Ubuntu
        run: uv run -q --group fares --group browser python "$TRIAL" chromium --out "$OUT" --browser "$(command -v google-chrome)"
      - name: Summary
        if: ${{ !cancelled() }}
        run: |
          uv run -q python "$TRIAL" summary --out "$OUT" > /dev/null
          cat "$OUT/summary.md" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        if: ${{ !cancelled() }}
        with:
          name: fare-reader-trial
          path: ${{ runner.temp }}/reader-trial
          retention-days: 30
