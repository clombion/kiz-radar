name: Tests

# Every check the repository has, as `mise run check` runs it (tasks.toml).
on:
  push:
  pull_request:

permissions:
  contents: read

env:
  UV_LOCKED: 1   # uv.lock as committed, or the check fails

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          submodules: true  # claims/, the admin's claims (pipeline/claims.py)
          persist-credentials: false
      - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8  # v5.1.2
      - name: The site's tools, and the browser its tests run in
        run: |
          mise run install:site
          pnpm exec playwright install --with-deps chromium
      - name: Every check
        run: mise run check
