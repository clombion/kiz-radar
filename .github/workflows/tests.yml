name: Tests

# Every check the repository has, as `mise run check` runs it (mise.toml).
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - name: Every check
        run: mise run check
