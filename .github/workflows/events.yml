name: Refresh events

# Once a month, update the export in source/ from kizomba-world.com (see pipeline/scrape.py), ask Claude
# the extraction passes for new and changed festivals (pipeline/extract/ask.py), read ticket pages
# (pipeline/tickets.py run: re-reads that are due, retries, first reads by two models), reload what the answers say
# and resolve the artists under the admin's latest claims (pipeline/claims.py), commit it all with the claims' pin,
# then start the Refresh places and rates workflow, which a push made with the Actions token doesn't start by itself.
# An event page that gave no answer, a failed ask, or a ticket page that broke its recipe or failed three times in a
# row, still commits the refresh, then marks the run failed; a load or resolve that fails still commits what was paid
# for, without the export (docs/guides/refreshing-events.md). Started by hand with festival ids, it skips the refresh
# and asks and reads those festivals only: after a prompt change that touches a few of them.
#
# Three jobs, each holding only what it needs: read fetches the web's pages (kizomba-world's, the ticket pages in a
# browser) with neither the key nor a token that can push; ask gives them to the models with the key and no such
# token, the merge review last, of the pairs the line-ups just answered give (pipeline/extract/merge_review.py);
# commit loads and pushes, with the token and no key. Each hands its changes to the next (.github/actions/
# handoff).
on:
  schedule:
    - cron: '17 5 3 * *'
  workflow_dispatch:
    inputs:
      limit:
        description: Ask Claude about at most this many festivals, and first-read at most this many (empty for all that need it)
        required: false
      festivals:
        description: Only these festivals, by id ("16909,18806"), without refreshing the events (empty for all)
        required: false

permissions: {}

concurrency:
  group: data-commit
  cancel-in-progress: false

env:
  UV_LOCKED: 1   # uv.lock as committed, or the step fails
  PYTHONUNBUFFERED: 1   # each line a step prints is in the log as it goes, not all at its end
  LIMIT: ${{ inputs.limit }}   # the inputs, as the steps read them
  ONLY: ${{ inputs.festivals }}

jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    outputs:
      scrape: ${{ steps.scrape.outcome }}
      tickets: ${{ steps.tickets.outcome }}
      handed: ${{ steps.handed.outcome == 'success' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/steps
      - name: Refresh the events
        id: scrape
        if: ${{ !inputs.festivals }}
        continue-on-error: true   # each event is written as it is read; one whose page gave no answer waits
        timeout-minutes: 40
        run: mise run scrape
      - name: Install a browser for ticket pages (the runner has a virtual display, xvfb)
        run: uv run -q --group browser patchright install --with-deps chromium
      - name: Read ticket pages
        id: tickets
        continue-on-error: true
        timeout-minutes: 30
        run: xvfb-run -a mise run tickets -- run --part pages ${ONLY:+--only "$ONLY"}
      - id: handed
        uses: ./.github/actions/handoff
        if: ${{ !cancelled() }}   # what was read, even when a step failed or ran out of time
        with:
          mode: give
          name: read

  ask:
    needs: read
    if: ${{ !cancelled() && needs.read.outputs.handed == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 100
    permissions:
      contents: read
    outputs:
      ask: ${{ steps.ask.outcome }}
      tickets: ${{ steps.tickets.outcome }}
      review: ${{ steps.review.outcome }}
      handed: ${{ steps.handed.outcome == 'success' }}
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/steps
      - uses: ./.github/actions/handoff
        with:
          mode: take
          name: read
          paths: >-
            source/kizomba_events_2026_2027.compact.sqlite pipeline/tickets/pages.csv pipeline/tickets/status.csv
            pipeline/tickets/log/ pipeline/tickets/reads/ pipeline/tickets/drafts/ pipeline/tickets/disputed/
            pipeline/tickets/partial/
      - name: Ask Claude about new and changed festivals
        id: ask
        continue-on-error: true
        timeout-minutes: 60   # each answer is saved as it comes
        run: >-
          mise run ask -- --pass extract --pass rooms_genres --pass prices
          ${LIMIT:+--limit "$LIMIT"} ${ONLY:+--only "$ONLY"}
      - name: First-read the ticket pages read today
        id: tickets
        continue-on-error: true
        timeout-minutes: 25
        run: mise run tickets -- run --part models ${LIMIT:+--limit "$LIMIT"} ${ONLY:+--only "$ONLY"}
      - name: The pairs of artists to review, from the line-ups just answered
        if: ${{ !inputs.festivals }}
        run: |
          mise run load
          mise run resolve
      - name: Ask Claude whether each pair is one artist
        id: review
        if: ${{ !inputs.festivals }}
        continue-on-error: true
        timeout-minutes: 30
        run: mise run ask -- --pass merge_review ${LIMIT:+--limit "$LIMIT"}
      - id: handed
        uses: ./.github/actions/handoff
        if: ${{ !cancelled() }}   # the answers paid for, even when a step failed or ran out of time
        with:
          mode: give
          name: asked

  commit:
    needs: [read, ask]
    if: ${{ !cancelled() && needs.ask.outputs.handed == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      actions: write   # to start Refresh places and rates
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0  # zizmor: ignore[artipacked] this job pushes, and uploads no artifact
      - uses: ./.github/actions/steps
      - id: taken
        uses: ./.github/actions/handoff
        with:
          mode: take
          name: asked
          paths: >-
            source/kizomba_events_2026_2027.compact.sqlite pipeline/tickets/pages.csv pipeline/tickets/status.csv
            pipeline/tickets/log/ pipeline/tickets/reads/ pipeline/tickets/drafts/ pipeline/tickets/disputed/
            pipeline/tickets/partial/ pipeline/extract/answers/ pipeline/prompts/asked/ pipeline/spend.csv
      - name: The day, for the commit
        id: now
        run: echo "day=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
      - name: The admin's latest claims, which the commit pins with the export they made
        run: git submodule update --remote claims
      - name: Load the answers and resolve the artists
        run: |   # the merge suggestions follow in Refresh places and rates, which reads the export this pushes
          mise run load
          mise run resolve
      - id: push
        uses: ./.github/actions/push   # then Refresh places and rates, which publishes
        with:
          paths: >-
            source claims pipeline/extract/answers pipeline/prompts/asked pipeline/tickets pipeline/spend.csv
          bot: events-bot
          message: Refresh events from kizomba-world and their extractions (${{ steps.now.outputs.day }})
          then: build.yml
      # A step between the patch taken and the push failed (the claims, the load or the resolve): the paid work is
      # pushed all the same, as the patch gave it, since load and resolve write only the export: the answers, the
      # spend, the prompts asked, the ticket pages' reads and logs. The export and the claims go back to the commit
      # the run is on, so the export on main is still one loaded and resolved; the next run, or `mise run load` and
      # `mise run resolve` by hand, loads what was kept. Nothing is started after it: the export didn't change.
      - name: The export and the claims as the run found them, when the claims, the load or the resolve failed
        id: aside
        if: ${{ failure() && steps.taken.outcome == 'success' && steps.push.outcome == 'skipped' }}
        run: |
          git restore --source=HEAD --staged --worktree -- source
          git submodule update --init claims
      - name: Keep the paid answers, the spend and the ticket reads
        if: ${{ failure() && steps.aside.outcome == 'success' }}
        uses: ./.github/actions/push
        with:
          paths: pipeline/extract/answers pipeline/prompts/asked pipeline/tickets pipeline/spend.csv
          bot: events-bot
          message: >-
            Keep the answers, spend and ticket reads of the events refresh whose load or resolve failed
            (${{ steps.now.outputs.day }})
      - name: Fail if the refresh, asking Claude or a ticket page failed
        if: >-
          needs.read.outputs.scrape == 'failure' || needs.read.outputs.tickets == 'failure' ||
          needs.ask.outputs.ask == 'failure' || needs.ask.outputs.tickets == 'failure' ||
          needs.ask.outputs.review == 'failure'
        run: exit 1
