name: Refresh events

# Once a month, update the export in source/ from kizomba-world.com (see pipeline/scrape.py), ask Claude
# the extraction passes for new and changed festivals (pipeline/extract/ask.py), read ticket pages
# (pipeline/tickets.py run: re-reads that are due, retries, first reads by two models), reload what the answers say
# and resolve the artists under the admin's latest claims (pipeline/claims.py), commit it all with the claims' pin,
# then start the Refresh places and rates workflow, which a push made with the Actions token doesn't start by itself.
# A failed ask, or a ticket page that broke its recipe or failed three times in a row, still commits the refresh, then
# marks the run failed. Started by hand with festival ids, it skips the refresh and asks
# and reads those festivals only: after a prompt change that touches a few of them.
on:
  schedule:
    - cron: '17 5 3 * *'
  workflow_dispatch:
    inputs:
      limit:
        description: Ask Claude about at most this many festivals, and first-read at most this many (empty for all that need it)
        required: false
      festivals:
        description: Only these festivals, by id ("16909,18806"), without refreshing the events (empty for all)
        required: false

permissions:
  contents: write
  actions: write

concurrency:
  group: data-commit
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:  # the inputs, for the steps that ask the models (the key goes to those steps only)
      LIMIT: ${{ inputs.limit }}
      ONLY: ${{ inputs.festivals }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/steps
      - name: Refresh the events
        if: ${{ !inputs.festivals }}
        run: mise run scrape
      - name: Ask Claude about new and changed festivals
        id: ask
        continue-on-error: true
        run: mise run ask -- ${LIMIT:+--limit "$LIMIT"} ${ONLY:+--only "$ONLY"}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - name: Install a browser for ticket pages (the runner has a virtual display, xvfb)
        run: uv run -q --group browser patchright install --with-deps chromium
      - name: Read ticket pages
        id: tickets
        continue-on-error: true
        run: xvfb-run -a mise run tickets -- run ${LIMIT:+--limit "$LIMIT"} ${ONLY:+--only "$ONLY"}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - name: The admin's latest claims, which the commit pins with the export they made
        run: git submodule update --remote claims
      - name: Load the answers and resolve the artists
        run: |
          mise run load
          mise run resolve
          mise run suggest-merges
      - name: Commit
        id: commit
        run: |
          git add "$SRC" claims pipeline/extract/answers pipeline/prompts/asked pipeline/artist_merge_suggestions.csv \
            pipeline/pass_prices.csv pipeline/ticket_pages.csv pipeline/tickets pipeline/spend.csv
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git config user.name "events-bot"   # the rebase below re-commits, so it needs the name as well
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Refresh events from kizomba-world and their extractions ($(date -u +%Y-%m-%d))"
          git pull --rebase --quiet
          git push
          echo "pushed=1" >> "$GITHUB_OUTPUT"
      - name: Refresh places and rates, then publish
        if: steps.commit.outputs.pushed
        run: gh workflow run build.yml --ref "$GITHUB_REF_NAME"   # on the branch the refresh committed to
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Fail if asking Claude or a ticket page failed
        if: steps.ask.outcome == 'failure' || steps.tickets.outcome == 'failure'
        run: exit 1
