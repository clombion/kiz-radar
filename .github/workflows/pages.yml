name: Publish site

# Compiles the site's TypeScript (site/) into docs/js/, builds its database from the export into docs/data/, and
# publishes docs/ to GitHub Pages, whenever main changes: on a push, and after the workflows that commit to main with
# the Actions token, whose pushes start no workflow of their own (Refresh places and rates, which Refresh events starts
# too, and Refresh fares).
on:
  push:
    branches: [main]
  workflow_run:
    workflows: [Refresh places and rates, Refresh fares]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# one publish at a time, each of main as it is when it starts
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: jdx/mise-action@v2
      - name: Compile the site, and build its data from the export
        run: |
          mise run build:site
          mise run build:data
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
