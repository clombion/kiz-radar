name: Publish site

# Compiles the site's TypeScript (site/) into docs/js/, builds its database from the export into docs/data/, and
# publishes docs/ to GitHub Pages, whenever main changes: on a push, and when a workflow that commits to main with the
# Actions token, whose pushes start no workflow of their own, starts it once it has pushed (Refresh places and rates,
# which Refresh events starts too, and Refresh fares). It publishes only data that every state in it is one of
# pipeline/states.py (pipeline/audit.py).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

env:
  UV_LOCKED: 1   # uv.lock as committed, or the build fails

# one publish at a time, each of main as it is when it starts
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: main
          submodules: true  # claims/, the admin's claims, which the audit and the database read
          persist-credentials: false
      - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8  # v5.1.2
      - name: Every state in the data is in pipeline/states.py
        run: mise run audit
      - name: Compile the site, and build its data from the export
        run: |
          mise run build:site
          mise run build:data
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d  # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          path: docs
  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5.0.1
