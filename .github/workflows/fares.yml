name: Refresh fares

# Every 2 hours, search the few (airport, month) pairs that are most overdue (see pipeline/fares.py)
# and commit the updated fares. A run stops early if Google rate-limits it; the next run carries on.
on:
  schedule:
    - cron: '23 */2 * * *'
  workflow_dispatch:
    inputs:
      budget:
        description: Searches in this run
        default: '8'

permissions:
  contents: write

concurrency:
  group: data-commit
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Search the most overdue routes
        run: python3 pipeline/fares.py refresh --budget "${{ inputs.budget || '8' }}" --max-seconds 1200
      - name: Commit new fares
        run: |
          git add docs/data/fares.csv pipeline/fare_jobs.csv
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git config user.name "fares-bot"   # the rebase below re-commits, so it needs the name as well
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Refresh fares ($(date -u +%Y-%m-%dT%H:%MZ))"
          git pull --rebase --quiet
          git push
