name: Refresh fares

# Once a day, search the festival weekends due today (see pipeline/fares.py) and commit the updated fares. If Google
# refuses a search, the run saves what it found, then is marked failed; the next run carries on. Publish runs once the
# fares are pushed.
on:
  schedule:
    - cron: '41 5 * * *'
  workflow_dispatch:
    inputs:
      budget:
        description: Searches in this run
        default: '20'

permissions:
  contents: write
  actions: write   # to start Publish

env:
  UV_LOCKED: 1   # uv.lock as committed, or the step fails
  BUDGET: ${{ inputs.budget || '20' }}

concurrency:
  group: data-commit
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v4.4.0  # zizmor: ignore[artipacked] this job pushes, and uploads no artifact
      - uses: ./.github/actions/steps
      - name: Search the festival weekends due today
        id: search
        continue-on-error: true
        run: mise run fares -- refresh --budget "$BUDGET" --max-seconds 1200
      - name: The time, for the commit
        id: now
        run: echo "at=$(date -u +%Y-%m-%dT%H:%MZ)" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/push
        with:
          paths: docs/data/fares.csv pipeline/fare_jobs.csv
          bot: fares-bot
          message: Refresh fares (${{ steps.now.outputs.at }})
          then: pages.yml
      - name: Fail if a search gave no answer (refused, timed out, unread)
        if: steps.search.outcome == 'failure'
        run: exit 1
