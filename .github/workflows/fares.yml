name: Refresh fares

# Once a day, search the festival weekends due today (see pipeline/fares.py) and commit the updated fares. If Google
# refuses a search, the run saves what it found, then is marked failed; the next run carries on.
on:
  schedule:
    - cron: '41 5 * * *'
  workflow_dispatch:
    inputs:
      budget:
        description: Searches in this run
        default: '20'

permissions:
  contents: write

concurrency:
  group: data-commit
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/steps
      - name: Search the festival weekends due today
        id: search
        continue-on-error: true
        run: mise run fares -- refresh --budget "${{ inputs.budget || '20' }}" --max-seconds 1200
      - name: Commit new fares
        run: |
          git add docs/data/fares.csv pipeline/fare_jobs.csv
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git config user.name "fares-bot"   # the rebase below re-commits, so it needs the name as well
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Refresh fares ($(date -u +%Y-%m-%dT%H:%MZ))"
          git pull --rebase --quiet
          git push
      - name: Fail if Google refused a search
        if: steps.search.outcome == 'failure'
        run: exit 1
