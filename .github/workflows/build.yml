name: Refresh places and rates

# When a new kizomba-world export or anything in pipeline/ is pushed, check every state in the data is one of
# pipeline/states.py (pipeline/audit.py), geocode any new cities, refresh the exchange rates and the merge
# suggestions, from the export in source/ (pipeline/db.py export), and commit what changed. Publish then builds the
# site's database from them.
on:
  push:
    branches: [main]
    paths:              # bot commits made with the Actions token don't trigger workflows, so this can't loop
      - 'source/**'
      - 'pipeline/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-commit
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/steps
      - name: Every state in the data is in pipeline/states.py
        run: mise run audit
      - name: Geocode new cities
        run: mise run geocode
      - name: Refresh the exchange rates
        run: mise run rates || true   # when the bank can't be reached, the last rates stay
      - name: Refresh merge suggestions
        run: mise run suggest-merges
      - name: Commit
        run: |
          git add pipeline/geocode.csv pipeline/artist_merge_suggestions.csv pipeline/rates.csv
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git config user.name "build-bot"   # the rebase below re-commits, so it needs the name as well
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Refresh places, rates and merge suggestions from $(basename "$SRC")"
          git pull --rebase --quiet
          git push
