name: Refresh places and rates

# When a new kizomba-world export or anything in pipeline/ is pushed, check every state in the data is one of
# pipeline/states.py (pipeline/audit.py), geocode any new cities, refresh the exchange rates and the merge
# suggestions, from the export in source/ (pipeline/db.py export), and commit what changed; a geocode or rates that
# failed still commits what the others found, then marks the run failed. Publish then builds the site's database from
# them, which this run starts (a push made with the Actions token starts no workflow).
on:
  push:
    branches: [main]
    paths:              # bot commits made with the Actions token don't trigger workflows, so this can't loop
      - 'source/**'
      - 'pipeline/**'
  workflow_dispatch:

permissions:
  contents: write
  actions: write   # to start Publish

env:
  UV_LOCKED: 1   # uv.lock as committed, or the step fails

concurrency:
  group: data-commit
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0  # zizmor: ignore[artipacked] this job pushes, and uploads no artifact
      - uses: ./.github/actions/steps
      - name: Every state in the data is in pipeline/states.py
        run: mise run audit
      - name: Geocode new cities
        id: geocode
        continue-on-error: true   # it saves each place found; one it got no answer for waits for the next run
        run: mise run geocode
      - name: Refresh the exchange rates
        id: rates
        continue-on-error: true   # when the bank can't be reached, the last rates stay
        run: mise run rates
      - name: Refresh merge suggestions
        run: mise run suggest-merges
      - name: The export's name, for the commit
        id: export
        run: echo "name=$(basename "$(mise run -q export)")" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/push
        with:
          paths: pipeline/geocode.csv pipeline/artist_merge_suggestions.csv pipeline/rates.csv
          bot: build-bot
          message: Refresh places, rates and merge suggestions from ${{ steps.export.outputs.name }}
      - name: Publish   # what it pushed, or what Refresh events, which started it, did
        if: ${{ !cancelled() }}
        run: gh workflow run pages.yml --ref "$GITHUB_REF_NAME"
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Fail if geocoding or the rates failed
        if: steps.geocode.outcome == 'failure' || steps.rates.outcome == 'failure'
        run: exit 1
