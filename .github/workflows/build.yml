name: Rebuild site database

# When a new kizomba-world export or anything in pipeline/ is pushed, geocode any new cities,
# rebuild docs/data/kiz.sqlite and refresh the merge suggestions. The newest .sqlite file in source/ is used.
on:
  push:
    branches: [main]
    paths:              # bot commits made with the Actions token don't trigger workflows, so this can't loop
      - 'source/**'
      - 'pipeline/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-commit
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Pick the newest export
        run: echo "SRC=$(ls -t source/*.sqlite | head -1)" >> "$GITHUB_ENV"
      - name: Geocode new cities
        run: python3 pipeline/geocode.py "$SRC"
      - name: Build docs/data/kiz.sqlite and site.json
        run: python3 pipeline/build_site_db.py "$SRC"
      - name: Refresh merge suggestions
        run: python3 pipeline/merge_suggestions.py "$SRC"
      - name: Commit
        run: |
          git add docs/data/kiz.sqlite docs/data/site.json pipeline/geocode.csv pipeline/artist_merge_suggestions.csv
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git -c user.name="build-bot" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "Rebuild site database from $(basename "$SRC")"
          git pull --rebase --quiet && git push
