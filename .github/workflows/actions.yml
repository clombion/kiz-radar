name: Actions up to date

# Once a month, fail naming each pinned action with a release at least two weeks old that the pin isn't on yet
# (pinact). It changes nothing: a push of the Actions token can't change a workflow, and the repository takes no pull
# requests, so a session updates them with `mise run update:actions` and commits to main.
on:
  schedule:
    - cron: '23 4 9 * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false
      - uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac  # v2.4.4
        with:
          install_args: pinact
      - name: Every pin on its latest release two weeks old
        run: pinact run --update --min-age 14 --fix=false
        env:
          GITHUB_TOKEN: ${{ github.token }}   # the releases, read through the API
