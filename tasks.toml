# The task runner's tasks, which mise.toml includes: `mise run check` runs every check the repository has, and is what
# Tests and the push hook run; `mise run check:fast` is its quick part, run before each commit (prek.toml).

["test:py"]
description = "The pipeline's tests, on every core in a new order, and the branches they reach (pyproject.toml)"
run = "uv run --group dev pytest -q --cov"

["build:data"]
description = "public/data/kiz.sqlite and site.json, which the site loads, built from the export (they are never committed)"
run = "uv run -m pipeline.build_site_db"

# The pipeline's steps, each run with the dependency group its module needs (pyproject.toml); what follows -- is the
# step's own arguments (`mise run tickets -- todo`), and every step opens the export itself.

[export]
description = "The path of the kizomba-world export the steps work on"
run = "uv run -q -m pipeline.export"

[scrape]
description = "Refresh the export's events from kizomba-world.com"
run = "uv run -q --group scrape -m pipeline.scrape"

[ask]
description = "Ask Claude the extraction passes for the festivals that need them"
run = "uv run -q --group ask -m pipeline.extract.ask"

["check-answer"]
description = "Check an answer to an extraction pass against its question, as ask does"
run = "uv run -q -m pipeline.extract.check_output"

[tickets]
description = "Ticket pages and first reads, one festival at a time (CLAUDE.md)"
run = "uv run -q --group tickets -m pipeline.tickets"

["read-page"]
description = "Read one web page a plain request can't, for a one-off check"
run = "uv run -q --group browser -m pipeline.read_page"

[load]
description = "Load the saved answers and ticket reads into the export"
run = "uv run -q -m pipeline.extract.load_extract"

[resolve]
description = "Resolve the export's artist mentions into artists, with stable ids"
run = "uv run -q -m pipeline.extract.resolve_artists"

["suggest-merges"]
description = "List likely duplicate artists for review (pipeline/artist_merge_suggestions.csv)"
run = "uv run -q -m pipeline.merge_suggestions"

[geocode]
description = "Place the export's cities on the map with OpenStreetMap Nominatim"
run = "uv run -q -m pipeline.geocode"

[rates]
description = "The euro's exchange rates from the European Central Bank"
run = "uv run -q -m pipeline.rates"

[fares]
description = "Search and keep the festival weekends' return fares"
run = "uv run -q -m pipeline.fares"

["install:site"]
description = "The site's tools, as pnpm-lock.yaml pins them"
run = "pnpm install --frozen-lockfile"

["build:site"]
description = "The site's TypeScript (site/) compiled into public/js/, and the libraries it loads copied into public/vendor/ from the pinned packages"
depends = ["install:site"]
run = "pnpm run build"

[serve]
description = "The site and its data built, and served at http://localhost:8000"
depends = ["build:site", "build:data"]
run = "python3 -m http.server -d public 8000"

["types:site"]
description = "tsc, strict, on the site and its tests"
depends = ["install:site"]
run = "pnpm run types"

["lint:site"]
description = "Biome's rules and format on the site, its tests and its CSS, with the lint/ plugins"
depends = ["install:site"]
run = "pnpm run lint"

[knip]
description = "No module, export or package the site doesn't use"
depends = ["install:site"]
run = "pnpm run knip"

["test:site"]
description = "The site's tests, in Node and in Chromium (vitest.config.ts), on the database built from the export"
depends = ["install:site", "build:data"]
run = "pnpm run test"

[dup]
description = "No block of 30 tokens or more written twice, in the code, tests, stylesheet or Actions (.jscpd.json); the generated files aside"
depends = ["install:site"]
run = "pnpm run dup"

["lock:py"]
description = "uv.lock is what pyproject.toml resolves to (the site's lock is held by install:site's --frozen-lockfile)"
run = "uv lock --check"

["lint:py"]
description = "Ruff's rules on the Python code"
run = "uv run --group dev ruff check"

["format:py"]
description = "The Python code as ruff formats it"
run = "uv run --group dev ruff format --check"

["format:md"]
description = "The Markdown as mdformat writes it (.mdformat.toml), the prompts left as they are"
run = "git ls-files -z '*.md' | xargs -0 uv run --group dev mdformat --check"

["types:py"]
description = "basedpyright, strict, on the pipeline and its tests"
run = "uv run --group dev basedpyright"

[audit]
description = "Every state in the data is one of pipeline/states.py"
run = "uv run -q --group tickets -m pipeline.audit"

[generate]
description = "Write the files built from pipeline/states.py"
run = "uv run -m pipeline.generate"

["generate:check"]
description = "The files built from pipeline/states.py still say what it does"
run = "uv run -m pipeline.generate --check"

[hooks]
description = "Install the git hooks (prek.toml): the quick checks before a commit, every check before a push; and check the claims submodule out"
run = "uv run --group dev prek install && git submodule update --init"

["lint:actions"]
description = "The workflows and their actions: actionlint, and zizmor's security rules (.github/zizmor.yml)"
run = "actionlint && uv run --group dev zizmor --offline -q .github"

["update:actions"]
description = "Move each pinned action to its latest release two weeks old (pinact), then check the workflows"
run = "pinact run --update --min-age 14 && mise run lint:actions"

["hooks:check"]
description = "prek.toml is a configuration prek reads"
run = "uv run --group dev prek validate-config prek.toml"

["check:fast"]
description = "The quick checks, before each commit"
depends = [
  "lock:py",
  "lint:py",
  "format:py",
  "format:md",
  "types:py",
  "lint:site",
  "types:site",
  "knip",
  "dup",
  "test:site",
  "generate:check",
  "hooks:check",
  "lint:actions",
]

["check:commit"]
description = "The quick checks, before a commit (prek.toml), on what is staged, in a worktree of its own"
run = """
staged="$(git commit-tree "$(git write-tree)" -p HEAD -m staged)"
unset GIT_INDEX_FILE  # git gives a hook the commit's index; the worktree has its own
tree="$(mktemp -d)/check"
git worktree add -q --detach "$tree" "$staged"
trap 'git worktree remove --force "$tree"' EXIT
cd "$tree" && mise trust -q && mise run check:fast
"""

["check:push"]
description = "Every check, before a push (prek.toml), on the commit pushed, in a worktree of its own"
run = """
to="${PRE_COMMIT_TO_REF:-$(git rev-parse HEAD)}"
[ "$to" = 0000000000000000000000000000000000000000 ] && exit 0  # a branch deleted: nothing to check
tree="$(mktemp -d)/check"
git worktree add -q --detach "$tree" "$to"
trap 'git worktree remove --force "$tree"' EXIT
# the claims at the commit's pin (the audit reads them), cloned from this clone's own copy of them: no fetch, and no
# submodule setting, which the worktrees share with the clone
claims="$(git rev-parse --path-format=absolute --git-common-dir)/modules/claims"
cd "$tree" && git clone -q --shared --no-checkout "$claims" claims && git -C claims checkout -q --detach "$(git rev-parse HEAD:claims)"
mise trust -q && mise run check
"""

[check]
description = "Every check"
depends = ["check:fast", "test:py", "audit"]
