# The task runner: `mise run check` runs every check the repository has, and is what Tests and the push hook run.
# `mise run check:fast` is its quick part, run before each commit. Python and its packages are uv's (uv.lock).

[tools]
node = "22.22.0"
uv = "0.11.32"

[tasks."test:py"]
description = "The pipeline's tests"
run = "uv run --group dev pytest -q"

[tasks."test:site"]
description = "The site's tests"
run = "node --test tests/site.test.mjs"

[tasks."lint:py"]
description = "Unused and undefined Python names"
run = "uv run --group dev pyflakes pipeline tests"

[tasks.audit]
description = "Every state in the data is one of pipeline/states.py"
run = "uv run --group tickets -m pipeline.audit"

[tasks.generate]
description = "Write the files built from pipeline/states.py"
run = "uv run -m pipeline.generate"

[tasks."generate:check"]
description = "The files built from pipeline/states.py still say what it does"
run = "uv run -m pipeline.generate --check"

[tasks."check:fast"]
description = "The quick checks, before each commit"
depends = ["lint:py", "test:site", "generate:check"]

[tasks.check]
description = "Every check"
depends = ["check:fast", "test:py", "audit"]
